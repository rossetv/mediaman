<svg xmlns="http://www.w3.org/2000/svg" width="830" height="776" viewBox="0 0 830 776" role="img" aria-label="How playback works: the browser talks only to mediaman; mediaman's stream manager opens a Plex transcode session and proxies the video back; progress is saved in mediaman's own database and nothing is written to Plex.">
<style>
:root{--bg:#ffffff;--box:#ffffff;--stroke:#aab2bd;--line:#6b7480;--text:#1f2329;--muted:#5b6470;--new:#2f6fd0;--newtint:#eef4fd;--area:#f5f7fa;--areastroke:#d5dae1;--bad:#c2412d;--badtint:#fdf3f1;}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--box:#161b22;--stroke:#4a525d;--line:#8c96a3;--text:#e6e9ee;--muted:#a0a9b5;--new:#6ea8fe;--newtint:#14223a;--area:#11161d;--areastroke:#2c333c;--bad:#f0806d;--badtint:#2a1714;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text);font-size:13px;}
.t{font-size:14px;font-weight:600;}
.m{fill:var(--muted);}
.l{font-size:12px;fill:var(--muted);}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;}
.tag{font-size:12px;font-weight:600;fill:var(--new);}
.box{fill:var(--box);stroke:var(--stroke);stroke-width:1;}
.newbox{fill:var(--newtint);stroke:var(--new);stroke-width:1;}
.ln{stroke:var(--line);stroke-width:1.25;fill:none;}
.dash{stroke-dasharray:5 4;}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="var(--line)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="var(--bad)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="830" height="776" fill="var(--bg)"/>

<text x="30" y="32" style="font-size:17px;font-weight:600">How playback works</text>
<text x="30" y="54" class="m">The browser only ever talks to mediaman; mediaman fetches the video from Plex and passes it on.</text>

<!-- mediaman area -->
<path d="M37 224H463a12 12 0 0 0 12-12V82a12 12 0 0 1 12-12H793a12 12 0 0 1 12 12V598a12 12 0 0 1-12 12H37a12 12 0 0 1-12-12V236a12 12 0 0 1 12-12Z" fill="var(--area)" stroke="var(--areastroke)"/>
<rect x="38" y="216" width="78" height="16" fill="var(--bg)"/>
<text x="44" y="228" class="l" style="font-weight:600">mediaman</text>

<!-- Browser -->
<rect class="box" x="45" y="80" width="290" height="100" rx="8"/>
<text x="61" y="106" class="t">Browser</text>
<text x="61" y="129" class="mono" textLength="134" lengthAdjust="spacingAndGlyphs">player.js + hls.js</text>
<text x="61" y="150" class="m">Watch page and player</text>
<text x="61" y="170" class="m">never talks to Plex or sees its token</text>

<!-- Viewer guard -->
<rect class="newbox" x="495" y="80" width="290" height="100" rx="8"/>
<rect x="747" y="73" width="30" height="14" fill="var(--area)"/>
<text x="762" y="84" class="tag" text-anchor="middle">new</text>
<text x="511" y="106" class="t">Viewer guard</text>
<text x="511" y="128" class="m">A viewer reaches Watch, Search, Downloads</text>
<text x="511" y="148" class="m">(view), Recommended, Keep and Account.</text>
<text x="511" y="168" class="m">Admin pages send a viewer to /watch.</text>

<!-- Browser -> guard -->
<path class="ln" d="M337 130H493" marker-end="url(#a)"/>
<text x="415" y="122" class="l" text-anchor="middle">page requests</text>

<!-- Browser <-> Stream API -->
<path class="ln" d="M170 182V268" marker-end="url(#a)"/>
<text x="162" y="206" class="l" text-anchor="end">start / progress / stop</text>
<path class="ln" d="M220 268V182" marker-end="url(#a)"/>
<text x="228" y="206" class="l">playlist + video segments</text>

<!-- Stream API -->
<rect class="box" x="45" y="270" width="290" height="100" rx="8"/>
<text x="61" y="296" class="t">Stream API</text>
<text x="61" y="320" class="m">start, progress and stop a play</text>
<text x="61" y="340" class="m">passes Plex's video on to the browser</text>

<!-- Stream manager -->
<rect class="newbox" x="495" y="270" width="290" height="100" rx="8"/>
<rect x="747" y="263" width="30" height="14" fill="var(--area)"/>
<text x="762" y="274" class="tag" text-anchor="middle">new</text>
<text x="511" y="296" class="t">Stream manager</text>
<text x="511" y="320" class="m">one Plex transcode session per play</text>
<text x="511" y="340" class="m">a cap on streams per person</text>
<text x="511" y="360" class="m">closes a stream idle for 3 min</text>

<!-- API <-> manager -->
<path class="ln" d="M337 305H493" marker-end="url(#a)"/>
<text x="415" y="297" class="l" text-anchor="middle">open / close a stream</text>
<path class="ln" d="M493 340H337" marker-end="url(#a)"/>
<text x="415" y="332" class="l" text-anchor="middle">playlist + segments</text>

<!-- API -> database -->
<path class="ln" d="M190 372V448" marker-end="url(#a)"/>
<text x="198" y="414" class="l">per-person watch progress</text>

<!-- Database -->
<rect class="newbox" x="45" y="450" width="290" height="74" rx="8"/>
<rect x="297" y="443" width="30" height="14" fill="var(--area)"/>
<text x="312" y="454" class="tag" text-anchor="middle">new</text>
<text x="61" y="476" class="t">Database (SQLite)</text>
<text x="61" y="500" class="m">each viewer's progress, kept in mediaman</text>
<text x="61" y="556" class="l" style="font-weight:600">Nothing is written to Plex:</text>
<text x="61" y="574" class="l">no timeline, no scrobble, the owner's history stays as it was.</text>

<!-- manager <-> Plex -->
<path class="ln" d="M610 372V648" marker-end="url(#a)"/>
<text x="602" y="472" class="l" text-anchor="end">transcode requests</text>
<text x="602" y="490" class="l" text-anchor="end">GET only, token in a header</text>
<path class="ln" d="M680 648V372" marker-end="url(#a)"/>
<text x="688" y="472" class="l">HLS playlist</text>
<text x="688" y="490" class="l">and segments</text>

<!-- Plex -->
<rect class="box" x="495" y="650" width="290" height="80" rx="8"/>
<text x="511" y="680" class="t">Plex Media Server</text>
<text x="511" y="704" class="m">the owner's library, unchanged</text>

<!-- Failure -->
<rect x="45" y="630" width="290" height="120" rx="8" fill="var(--badtint)" stroke="var(--bad)" stroke-width="1" class="dash"/>
<text x="61" y="656" class="t">If Plex can't be reached</text>
<text x="61" y="680" class="m">Watch keeps its rows and says</text>
<text x="61" y="698">"Can't reach Plex right now"</text>
<text x="61" y="720" class="m">The player says why it can't play: gone,</text>
<text x="61" y="738" class="m">not set up, unreachable, too many streams</text>
<path class="ln dash" style="stroke:var(--bad)" d="M493 690H337" marker-end="url(#ab)"/>
<text x="415" y="682" class="l" text-anchor="middle" style="fill:var(--bad)">no answer</text>
</svg>
