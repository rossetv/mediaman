{# The title detail overlay at #title=<ref>. watch/detail.js fills it from
   /api/watch/title/<ref>; nothing here carries a title's data. #}
<div class="ttl" id="ttl" role="dialog" aria-modal="true" aria-labelledby="ttl-title" hidden>
  <div class="ttl__scrim" data-ttl-close></div>
  <div class="ttl__sheet">
    <button type="button" class="ttl__close" data-ttl-close aria-label="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    <div class="ttl__hero">
      <span class="skel ttl__hero-skel" data-ttl-part="hero-skel"></span>
      <img class="ttl__art" alt="" data-ttl-part="art" hidden>
      <div class="ttl__player" data-ttl-part="player"></div>
      <div class="ttl__head">
        <span class="ttl__kind" data-ttl-part="kind"></span>
        <h2 class="ttl__title" id="ttl-title" tabindex="-1"></h2>
        <p class="ttl__tagline" data-ttl-part="tagline" hidden></p>
        <p class="ttl__meta" data-ttl-part="meta"></p>
      </div>
    </div>
    <div class="ttl__body" data-ttl-part="body"></div>
  </div>
</div>
