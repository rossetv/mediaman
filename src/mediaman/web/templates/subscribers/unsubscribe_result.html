<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe · Mediaman</title>
  <link rel="stylesheet" href="/static/css/_tokens.css">
  <link rel="stylesheet" href="/static/css/_unsubscribe.css">
</head>
<body class="unsub-body">
  <div class="unsub-card">
    {% if success %}
    <div class="unsub-icon--success" aria-hidden="true">&#10003;</div>
    {% else %}
    <div class="unsub-icon--error" aria-hidden="true">&#10007;</div>
    {% endif %}
    <div class="unsub-brand">media<span class="unsub-brand-accent">man</span></div>
    <h1 class="unsub-title">{% if success %}Unsubscribed{% else %}Couldn't unsubscribe{% endif %}</h1>
    <p class="unsub-msg">{{ message }}</p>
    <p class="unsub-note">You can close this page.</p>
  </div>
</body>
</html>
