{% extends "base.html" %}

{% block title %}Unsubscribe · Mediaman{% endblock %}

{% block head %}<link rel="stylesheet" href="/static/css/_unsubscribe.css">{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card unsub-card">
    <div class="unsub-brand" aria-hidden="true">media<span class="unsub-brand-accent">man</span></div>
    <h1 class="unsub-title">Unsubscribe?</h1>
    <p class="unsub-sub">
      You will no longer receive newsletter emails at
      <strong class="unsub-email">{{ email }}</strong>
    </p>
    <form method="POST" action="/unsubscribe" data-submit-guard>
      <input type="hidden" name="email" value="{{ email }}">
      <input type="hidden" name="token" value="{{ token }}">
      <button type="submit" class="unsub-btn-danger" data-busy-label="Unsubscribing…">Unsubscribe</button>
    </form>
    <p class="unsub-note">Changed your mind? Close this page and nothing changes.</p>
  </div>
</div>
<script src="/static/js/submit-guard.js" defer></script>
{% endblock %}
