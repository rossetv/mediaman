<!DOCTYPE html>
<!-- CSP status: script-src does not permit 'unsafe-inline'.
     Every page-level script lives in static/js/; the only remaining inline scripts are
     <script type="application/json"> data islands, which CSP does not
     gate. style-src still allows 'unsafe-inline' for the few inline styles
     that carry data (bar widths). -->
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Mediaman{% endblock %}</title>
  <!-- CSS is split into per-concern fragments under static/css/.
       Order: tokens first, then _base.css (reset + layout primitives),
       then concern-specific files. Cascade follows source order, so
       later rules win when specificity is equal. -->
  <link rel="stylesheet" href="/static/css/_tokens.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_base.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_forms.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_tables.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_history.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_modal.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_login.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_nav.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_buttons.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_tiles.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_hero.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_dl.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_download_page.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_settings.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_settings_pg.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_settings_pg_panels.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_profile.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_profile_plex.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_keep.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_ui_feedback.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_watch.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_player.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/_utilities.css?v={{ static_v }}">
  <script src="/static/js/core/api.js?v={{ static_v }}" defer></script>
  <script src="/static/js/core/dom.js?v={{ static_v }}" defer></script>
  <script src="/static/js/core/modal.js?v={{ static_v }}" defer></script>
  <script src="/static/js/modal-a11y.js?v={{ static_v }}" defer></script>
  <script src="/static/js/ui-feedback.js?v={{ static_v }}" defer></script>
  <script src="/static/js/snooze-menu.js?v={{ static_v }}" defer></script>
  <script src="/static/js/nav.js?v={{ static_v }}" defer></script>
  <script src="/static/js/dl-poster.js?v={{ static_v }}" defer></script>
  <script src="/static/js/broken-poster.js?v={{ static_v }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body data-page="{{ nav_active or '' }}">
  {% include "_icons.html" %}
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% block nav %}{% endblock %}
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  {% block overlays %}{% endblock %}
</body>
</html>
